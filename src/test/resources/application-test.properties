# Profil de test : base H2 en mémoire, aucune dépendance à XAMPP/MariaDB
spring.datasource.url=jdbc:h2:mem:smartrecruit_test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Secret JWT de test (longueur suffisante pour HS256)
app.jwt.secret=TestOnlySmartRecruitJwtSecretKey-0123456789-0123456789-ABCDEF
app.jwt.expiration-ms=3600000

# Aucun appel réseau vers FastAPI dans les tests existants.
# Les tests d'intégration de l'indexation activent explicitement le service et mockent AiServiceClient.
app.ai-service.enabled=false

# Administrateur de test, créé au démarrage du contexte
app.admin.email=admin@test.local
app.admin.password=Admin123!
app.admin.first-name=Admin
app.admin.last-name=Test

logging.level.com.smartrecruit=INFO

# --- Module 1 (Jalel) - gestion des candidats ---
app.cv.storage-dir=${java.io.tmpdir}/smartrecruit-test-cvs
