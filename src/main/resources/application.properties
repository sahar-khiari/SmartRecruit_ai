# ============================================================
# SmartRecruit AI - Backend commun
# ============================================================
spring.application.name=smartrecruit-backend

# --- Serveur ---
server.port=8080

# --- Base de données MariaDB (XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/smartrecruit_ai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate : génération automatique des tables ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Secret de DÉVELOPPEMENT uniquement : à remplacer via la variable JWT_SECRET en production.
# HS256 exige au minimum 256 bits (32 caractères).
app.jwt.secret=${JWT_SECRET:SmartRecruitAI-dev-jwt-secret-key-please-change-me-0123456789-ABCDEF}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Compte administrateur initial (uniquement si aucun ADMIN n'existe) ---
app.admin.email=${ADMIN_EMAIL:admin@smartrecruit.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.first-name=${ADMIN_FIRST_NAME:Admin}
app.admin.last-name=${ADMIN_LAST_NAME:SmartRecruit}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Microservice interne de recherche sémantique (jamais exposé à Angular) ---
# La clé reste côté serveur et doit correspondre à AI_SERVICE_API_KEY du service FastAPI.
app.ai-service.enabled=${AI_SERVICE_ENABLED:true}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
app.ai-service.api-key=${AI_SERVICE_API_KEY:smartrecruit-local-development-key}
app.ai-service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:30}
app.ai-service.chat-timeout-seconds=${AI_SERVICE_CHAT_TIMEOUT_SECONDS:120}
app.ai-service.reindex-all-max=${AI_SERVICE_REINDEX_ALL_MAX:100}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# --- Logs ---
logging.level.com.smartrecruit=INFO
logging.level.org.springframework.security=INFO

# --- Module 1 (Jalel) - gestion des candidats ---
# Stockage des CV (hors du dépôt Git)
app.cv.storage-dir=${CV_STORAGE_DIR:${user.home}/smartrecruit/cvs}
app.cv.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
# Analyse de CV : Gemini (~20 s) + nouvel essai + modèle de secours
app.ai-service.cv-timeout-seconds=${AI_SERVICE_CV_TIMEOUT_SECONDS:120}
